# Local development profile — H2 in-memory, no external DB/LDAP needed.
# Usage: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:h2:mem:coresystem;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# Override JWT + LDAP placeholders so app starts without real credentials
coresystem:
  app:
    jwtSecret: dGVzdC1qd3Qtc2VjcmV0LWZvci1sb2NhbC1kZXZlbG9wbWVudC1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi1iYXNlNjQ=
    jwtExpirationMs: 86400000
  ldap:
    urlToken: http://localhost:9999/token
    urlVerifyPassword: http://localhost:9999/verify
    clientId: test-client
    clientSecret: test-secret
    username: test-user
    password: test-pass
    partnerId: test-partner
    channelId: test-channel
    host: localhost
    aesKey: test-aes-key-1234567890123456

# Swagger UI accessible without auth
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# Actuator health endpoint
management:
  endpoints:
    web:
      exposure:
        include: health,info,h2-console
