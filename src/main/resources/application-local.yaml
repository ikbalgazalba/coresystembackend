# Local/dev profile — H2 in-memory OR real PostgreSQL depending on env.
# Default: H2. Set SPRING_DATASOURCE_URL to use real DB.
# Usage: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local -DskipTests
#        SPRING_DATASOURCE_URL=jdbc:postgresql://tibsdbdev... ./mvnw spring-boot:run -Dspring-boot.run.profiles=local -DskipTests
spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:coresystem;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL:create-drop}
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

coresystem:
  app:
    jwtSecret: dGVzdC1qd3Qtc2VjcmV0LWZvci1sb2NhbC1kZXZlbG9wbWVudC1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi1iYXNlNjQ=
    jwtExpirationMs: 86400000
  ldap:
    urlToken: http://localhost:9999/token
    urlVerifyPassword: http://localhost:9999/verify
    clientId: test-client
    clientSecret: test-secret
    username: test-user
    password: test-pass
    partnerId: test-partner
    channelId: test-channel
    host: localhost
    aesKey: test-aes-key-1234567890123456

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
