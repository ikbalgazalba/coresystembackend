# docker-compose.yml — run coresystembackend in Docker with real PostgreSQL.
# SDD-PROVENANCE: master-data | vault: .mega-sdd/vaults/acquisition-master-data
services:
  app:
    build: .
    image: coresystembackend:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://tibsdbdev.bankmegadev.net:5432/coresystem
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: P@ssw0rd
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      HIBERNATE_DDL: none
      JAVA_OPTS: ""
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
