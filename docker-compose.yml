# docker-compose.yml — coresystembackend with real .env + truststore volume
services:
  app:
    build: .
    image: coresystembackend:latest
    env_file: .env.docker
    ports:
      - "8080:8080"
    volumes:
      - /home/ikbalgazalba/.ssl-truststores/bankmega-truststore.p12:/opt/bankmega-truststore/bankmega-truststore.p12:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
